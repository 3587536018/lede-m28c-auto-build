<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M28C 控制台 · 布局预览</title>
  <style>
    body { margin: 0; background: #f3f6f8; color: #243b41; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .preview-bar { padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: #fff3cd; font-size: 12px; }
    .preview-bar label { display: flex; gap: 6px; align-items: center; }
    .preview-bar select { padding: 4px; border: 1px solid #d0b95f; border-radius: 4px; }
    .preview-shell { display: flex; min-height: calc(100vh - 48px); }
    .preview-nav { width: 190px; flex-shrink: 0; background: #fff; padding: 28px 18px; border-right: 1px solid #e3eae9; }
    .preview-brand { padding: 0 16px 26px; font-size: 23px; font-weight: 700; letter-spacing: 1px; }
    .preview-nav div:not(.preview-brand) { padding: 12px 16px; margin: 4px 0; font-size: 13px; color: #647770; }
    .preview-nav .selected { background: #e6f3ef; color: #07846f !important; border-radius: 8px; font-weight: 600; }
    main { flex: 1; min-width: 0; padding: 28px; }
    #preview-error { color: #9f2525; white-space: pre-wrap; }
    html[data-darkmode="true"] body { background: #172522; }
    html[data-darkmode="true"] .preview-nav { background: #233431; border-color: #344a47; color: #dce8e5; }
    @media (max-width: 800px) { .preview-nav { display: none; } main { padding: 14px; } .preview-bar { padding: 9px 14px; } }
  </style>
</head>
<body>
  <div class="preview-bar">
    <strong>界面预览 · 示例数据，未连接设备</strong>
    <label>场景 <select id="scenario"><option value="normal">正常</option><option value="offline">读取失败</option><option value="empty">无扩展插件</option><option value="zero">刚启动 / 内存耗尽</option></select></label>
    <label><input id="dark" type="checkbox">深色</label>
    <span>直接加载包内 dashboard.js 与 CSS</span>
  </div>
  <div class="preview-shell">
    <aside class="preview-nav" aria-label="预览导航">
      <div class="preview-brand">M28C</div>
      <div class="selected">控制台</div><div>状态</div><div>系统</div><div>服务</div><div>网络存储</div><div>Docker</div><div>网络</div><div>调制解调器</div><div>iStore 应用商店</div><div>OpenClash</div>
    </aside>
    <main id="preview"><p>正在加载实际控制台代码…</p></main>
  </div>
  <script>
    'use strict';
    const base = '../package/luci-app-m28c/htdocs/luci-static/resources/';
    const scenario = new URLSearchParams(location.search).get('scenario') || 'normal';
    document.getElementById('scenario').value = scenario;
    document.getElementById('scenario').addEventListener('change', event => {
      location.search = '?scenario=' + event.target.value;
    });
    document.getElementById('dark').addEventListener('change', event => {
      document.documentElement.dataset.darkmode = String(event.target.checked);
    });
    function E(tag, attrs, children) {
      const element = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([key, value]) => {
        if (typeof value === 'function') element.addEventListener(key, value);
        else if (value != null) element.setAttribute(key, value);
      });
      function append(child) {
        if (Array.isArray(child)) child.forEach(append);
        else if (child instanceof Node) element.appendChild(child);
        else if (child != null) element.appendChild(document.createTextNode(String(child)));
      }
      append(children);
      return element;
    }
    const menu = { children: {} };
    const routes = ['admin/status/overview', 'admin/system/admin/password', 'admin/system/system', 'admin/system/mounts', 'admin/network/network', 'admin/network/wireless'];
    if (scenario !== 'empty') routes.push('admin/modem', 'admin/openclash', 'admin/store', 'admin/docker', 'admin/nas/samba4', 'admin/nas/vsftpd', 'admin/services/ddns');
    for (const route of routes) {
      let current = menu;
      for (const part of route.split('/')) {
        current.children = current.children || {};
        current.children[part] = current.children[part] || { satisfied: true, children: {} };
        current = current.children[part];
      }
    }
    const samples = {
      board: { model: 'MangoPi M28C', hostname: 'M28C', kernel: '6.12.104', release: { description: 'LEDE · M28C 定制版' } },
      info: { uptime: scenario === 'zero' ? 0 : 172860, load: [15728, 10486, 6554], memory: { total: 1024 ** 3, available: scenario === 'zero' ? 0 : 740 * 1024 ** 2 } },
      getMountPoints: [
        { mount: '/', size: 128 * 1024 ** 2, free: 0, avail: 0 },
        { mount: '/overlay', size: 1024 ** 3, free: 670 * 1024 ** 2, avail: 650 * 1024 ** 2 },
        { mount: '/opt', size: 27 * 1024 ** 3, free: 24 * 1024 ** 3, avail: 24 * 1024 ** 3 }
      ]
    };
    const rpc = { declare: specification => () => scenario === 'offline'
      ? Promise.reject(new Error('Mock RPC unavailable'))
      : Promise.resolve(samples[specification.method]) };
    const L = {
      url: (...parts) => '#/' + parts.join('/'),
      resource: path => base + path,
      resolveDefault: (promise, fallback) => promise.catch(() => fallback)
    };
    const callbacks = [];
    const poll = { add: callback => callbacks.push(callback) };
    const ui = { menu: { load: () => Promise.resolve(menu) } };
    const view = { extend: object => object };
    fetch(base + 'view/m28c/dashboard.js').then(response => {
      if (!response.ok) throw new Error('dashboard.js: HTTP ' + response.status);
      return response.text();
    }).then(source => {
      const dashboard = new Function('view', 'rpc', 'poll', 'ui', 'L', 'E', source)(view, rpc, poll, ui, L, E);
      return dashboard.load().then(data => dashboard.render(data));
    }).then(element => {
      document.getElementById('preview').replaceChildren(element);
      document.body.dataset.previewReady = 'true';
      setInterval(() => callbacks.forEach(callback => callback()), 10000);
    }).catch(error => {
      document.getElementById('preview').replaceChildren(E('pre', { id: 'preview-error' }, error.stack));
    });
  </script>
</body>
</html>
