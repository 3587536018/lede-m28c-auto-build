#Supplemental signed OpenWrt 24.10 user-space feeds for aarch64_generic.
#This LEDE image uses Linux 6.12.104; OpenWrt 24.10.5 uses Linux 6.6.119.
#Do not add the foreign target core/kmods repositories. Use this build's IPKs.
#The core feed also replaces target-specific base-files and other system packages.
#istore, openclash and qmodem are source feed names, not published directories here.
#Their existing installed applications are retained; iStore manages its compat feed.
#These feeds do not make cross-distribution or bulk package upgrades compatible.
#Keep comments adjacent to the hash: upstream defaults strip hash-plus-space.
src/gz openwrt_base https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_generic/base
src/gz openwrt_luci https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_generic/luci
src/gz openwrt_packages https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_generic/packages
src/gz openwrt_routing https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_generic/routing
src/gz openwrt_telephony https://mirrors.tencent.com/lede/releases/24.10.5/packages/aarch64_generic/telephony
