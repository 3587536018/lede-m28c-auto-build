name: Build and Release

on:
  schedule:
    - cron: '0 18 * * 4'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a public release (main branch only)'
        type: boolean
        default: false
  push:
    branches:
      - main
      - codex/m28c-public-custom
    paths-ignore:
      - 'docs/**'
      - 'screenshot/**'
      - '*.md'

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Validate customization
        run: |
          python3 -m pip install --disable-pip-version-check 'lupa==2.8'
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/expand-data-test.sh
          bash -n build.sh
          bash -n prepare.sh
          sh -n install-env.sh
          sh -n files/etc/uci-defaults/zzzz-custom
          sh -n files/etc/uci-defaults/99-expand-data
      - name: Free runner disk space
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-mark hold grub-efi-amd64-signed || true
          sudo apt-get purge -y 'azure-cli*' 'ghc*' 'zulu*' 'llvm*' 'firefox*' 'google*' 'dotnet*' 'powershell*' 'openjdk*' 'mysql*' 'php*' 'mongodb*' 'snap*' || true
          sudo apt-get autoremove -y --purge || true
          sudo apt-get clean
          df -h
      - name: Enable build swap
        run: |
          if ! sudo swapon --show | grep -q /swapfile; then
            sudo chattr -i /swapfile 2>/dev/null || true
            sudo rm -f /swapfile 2>/dev/null || true
            sudo fallocate -l 4096M /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h
      - name: Install build dependencies
        run: |
          set -o pipefail
          sudo ./install-env.sh 2>&1 | tee /tmp/envsetup.log
      - name: Prepare locked sources
        run: |
          set -o pipefail
          ./prepare.sh 2>&1 | tee /tmp/prepare.log
      - name: Cache source downloads
        id: dl-cache
        uses: actions/cache/restore@v4
        with:
          path: lede/dl
          key: ${{ runner.os }}-22.04-m28c-dl-v3-${{ hashFiles('sources.lock.json', 'm28c.config', 'package/**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-22.04-m28c-dl-v3-
      - name: Build firmware
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee /tmp/buildall.log
      - name: Prepare verified firmware assets
        run: |
          set -euo pipefail
          mkdir -p release_assets
          target=lede/bin/targets/rockchip/armv8
          cp "$target"/*widora_mangopi-m28c*ext4*.img.gz release_assets/
          cp "$target"/*widora_mangopi-m28c*squashfs*.img.gz release_assets/
          cp "$target"/openwrt-rockchip-armv8-widora_mangopi-m28c.manifest release_assets/
          cp "$target"/{config.buildinfo,feeds.buildinfo,version.buildinfo,profiles.json} release_assets/
          cp sources.lock.json release_assets/
          git rev-parse HEAD > release_assets/customization.commit
          gzip -t release_assets/*.img.gz
          python3 scripts/prepare-sources.py --verify-manifest "$target"/openwrt-rockchip-armv8-widora_mangopi-m28c.manifest
          python3 - "$target"/openwrt-rockchip-armv8-widora_mangopi-m28c.manifest <<'PY'
          import json
          import sys
          from pathlib import Path
          lock = json.loads(Path('sources.lock.json').read_text())
          expected = lock['baseline']['kernel']
          manifest = Path(sys.argv[1]).read_text().splitlines()
          if not any(line.startswith(f'kernel - {expected}-') for line in manifest):
              raise SystemExit(f'Kernel differs from the pinned baseline: expected {expected}')
          print(f'Verified kernel {expected}')
          PY
          cd release_assets
          sha256sum *.img.gz > sha256sums
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: m28c-public-firmware-${{ github.run_number }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 14
      - name: Check downloaded sources for caching
        id: downloaded-sources
        if: always() && steps.dl-cache.outputs.cache-hit != 'true' && steps.dl-cache.outputs.cache-primary-key != ''
        run: |
          if [ -d lede/dl ] && [ -n "$(find lede/dl -type f -print -quit)" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save downloaded sources even after a build failure
        if: always() && steps.downloaded-sources.outputs.available == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: lede/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p build-diagnostics
          for file in /tmp/envsetup.log /tmp/prepare.log /tmp/buildall.log /tmp/build.log /tmp/buildfail.log /tmp/tmpinfo.log; do
            [ ! -f "$file" ] || cp "$file" build-diagnostics/
          done
          [ ! -f lede/.config ] || cp lede/.config build-diagnostics/generated.config
          cp sources.lock.json build-diagnostics/
          df -h > build-diagnostics/disk.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m28c-build-diagnostics-${{ github.run_number }}
          path: build-diagnostics/
          retention-days: 14

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m28c-public-firmware-${{ github.run_number }}
          path: release_assets/
      - name: Set unique release identity
        id: release
        run: |
          stamp=$(TZ=Asia/Shanghai date +'%Y%m%d.%H%M%S')
          version=$(cat release_assets/version.buildinfo)
          echo "tag=m28c-${stamp}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "title=M28C 中文定制版 ${stamp} - ${version}" >> "$GITHUB_OUTPUT"
          cat > release_assets/RELEASE.md <<'EOF'
          MangoPi M28C 公开定制固件：中文控制台、iStore、QModem、OpenClash、Docker、Homebox。

          首次通过网线访问 http://192.168.1.1，以 root 登录 LuCI 并设置密码，再配置 Wi-Fi。
          固件不预置密码、Wi-Fi 密钥、代理订阅、DDNS 令牌或设备私钥。
          OpenClash、文件共享和 FTP 需要自行配置并启用。

          刷写整张 TF 卡会覆盖卡上的数据，请先备份。源码版本见 sources.lock.json，镜像校验见 sha256sums。
          EOF
      - name: Publish firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.title }}
          body_path: release_assets/RELEASE.md
          fail_on_unmatched_files: true
          files: |
            release_assets/*.img.gz
            release_assets/*.manifest
            release_assets/*.buildinfo
            release_assets/profiles.json
            release_assets/sources.lock.json
            release_assets/customization.commit
            release_assets/sha256sums
