name: Build and Release

on:
  schedule:
    - cron: '0 18 * * 4'
  workflow_dispatch:
    # inputs:
    #   tag_name:
    #     description: 'Tag name (e.g., v1.0.0)'
    #     required: true
  push:
    branches:
      - main
    tags:
      - .*

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check build space
        run: |
          df -h
          lsblk
          free -h
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: 'true'
      - name: Manual cleanup for extra space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android /opt/az /usr/local/share/powershell /usr/local/share/vcpkg 2>/dev/null || true
          sudo rm -rf /usr/local/lib/node_modules /usr/share/swift /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          df -h
      - name: Check build space after maximize-build-space
        run: |
          df -h
          lsblk
          free -h
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup environment
        shell: bash
        run: |
          set -o pipefail
          if ! sudo ./install-env.sh 2>&1 | tee /tmp/envsetup.log; then
            EXIT=${PIPESTATUS[0]}
            echo "=== env setup failed (exit $EXIT), pushing diagnostics to debug-env branch ==="
            git config user.email "build-bot@users.noreply.github.com"
            git config user.name "build-bot"
            git checkout -B debug-env
            cp /tmp/envsetup.log debug-env.log
            git add debug-env.log
            git commit -m "debug: environment setup failure log"
            git push origin debug-env
            exit $EXIT
          fi
      - name: Prepare
        run: |
          ./prepare.sh
      - name: Cache OpenWrt dl and toolchain
        uses: actions/cache@v3
        if: always()
        with:
          path: |
            lede/dl
            lede/staging_dir
#            lede/build_dir
          key: ${{ runner.os }}-openwrt-${{ hashFiles('lede/feeds.conf.default', 'm28c.config') }}
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! ./build.sh 2>&1 | tee /tmp/buildall.log; then
            EXIT=${PIPESTATUS[0]}
            echo "=== build failed (exit $EXIT), pushing diagnostics to debug-env branch ==="
            git config user.email "build-bot@users.noreply.github.com"
            git config user.name "build-bot"
            git checkout -B debug-env
            cp /tmp/buildfail.log debug-build.log 2>/dev/null || tail -100 /tmp/buildall.log > debug-build.log
            git add debug-build.log
            git commit -m "debug: build failure log"
            git push origin debug-env
            exit $EXIT
          fi
      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          # 关键产物(.img.gz 固件 / manifest)缺失时必须失败，避免"假成功"发布空 release
          cp lede/bin/targets/rockchip/armv8/*.img.gz release_assets/
          cp lede/bin/targets/rockchip/armv8/openwrt-rockchip-armv8-widora_mangopi-m28c.manifest release_assets/
          cp lede/bin/targets/rockchip/armv8/config.buildinfo release_assets/ || true
          cp lede/bin/targets/rockchip/armv8/feeds.buildinfo release_assets/ || true
          cp lede/bin/targets/rockchip/armv8/profiles.json release_assets/ || true
          cp lede/bin/targets/rockchip/armv8/version.buildinfo release_assets/ || true
          cp lede/bin/targets/rockchip/armv8/sha256sums release_assets/ || true
          ls -la release_assets
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: release_assets/
      - name: Calculate disk usage
        if: always()
        run: |
          df -h
          lsblk
          du -h --max-depth=2
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: release_assets/
      - name: List files
        run: |
          ls -lah
          ls -lah release_assets
      - name: Get current date and time for release info
        id: release-prepare
        run: |
          current_date=$(TZ=Asia/Shanghai date +'%y%m%d')
          current_time=$(TZ=Asia/Shanghai date +'%H%M%S')
          echo "current_date=${current_date}" >> $GITHUB_OUTPUT
          echo "current_time=${current_time}" >> $GITHUB_OUTPUT
          RELEASE_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          VERSION=$(cat release_assets/version.buildinfo | grep '^r' | head -n 1)
          echo "RELEASE_TITLE=${RELEASE_DATE} - ${VERSION}" >> $GITHUB_OUTPUT
      - name: Check for changes since last tag
        id: check-changes
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$latest_tag" ]; then
            echo "needs_new_tag=true" >> $GITHUB_OUTPUT
            echo "new_tag=v0.${{ steps.release-prepare.outputs.current_date }}.${{ steps.release-prepare.outputs.current_time }}" >> $GITHUB_OUTPUT
          else
            has_changes=$(git diff --quiet $latest_tag HEAD || echo "true")
            if [ -n "$has_changes" ]; then
              echo "needs_new_tag=true" >> $GITHUB_OUTPUT
              echo "new_tag=v0.${{ steps.release-prepare.outputs.current_date }}.${{ steps.release-prepare.outputs.current_time }}" >> $GITHUB_OUTPUT
            else
              echo "needs_new_tag=false" >> $GITHUB_OUTPUT
              echo "new_tag=$latest_tag" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Create new tag if needed
        if: steps.check-changes.outputs.needs_new_tag == 'true'
        run: |
          git tag ${{ steps.check-changes.outputs.new_tag }}
          git push origin ${{ steps.check-changes.outputs.new_tag }}
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check-changes.outputs.new_tag }}
          # tag_name: ${{ inputs.tag_name }}
          name: ${{ steps.release-prepare.outputs.RELEASE_TITLE }}
          body_path: release_assets/openwrt-rockchip-armv8-widora_mangopi-m28c.manifest
          files: |
            release_assets/*.img.gz
            release_assets/openwrt-rockchip-armv8-widora_mangopi-m28c.manifest
            release_assets/config.buildinfo
            release_assets/feeds.buildinfo
            release_assets/profiles.json
            release_assets/version.buildinfo
            release_assets/sha256sums
